name: TypeScript Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Run w/ Serial
        run: node index.js
        env:
          SERIAL: true

      - name: Reset Env
        run: killall node -v

      - name: Run w/ Parallel
        run: node index.js
        env:
          PARALLEL: true

      - name: Reset Env
        run: killall node -v
